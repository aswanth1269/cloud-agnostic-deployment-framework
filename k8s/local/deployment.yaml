# Local Minikube simulation manifest.
# Uses the locally built image (cloud-demo:local, never pulled) and a single
# replica. Real clusters use k8s/base + k8s/overlays/<cloud> instead.

apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloud-agnostic-demo
  labels:
    app: cloud-agnostic-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cloud-agnostic-demo
  template:
    metadata:
      labels:
        app: cloud-agnostic-demo
    spec:
      automountServiceAccountToken: false
      containers:
        - name: cloud-agnostic-demo
          image: cloud-demo:local
          imagePullPolicy: Never
          ports:
            - containerPort: 3000
              name: http
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: cloud-agnostic-demo-service
  labels:
    app: cloud-agnostic-demo
spec:
  type: ClusterIP
  selector:
    app: cloud-agnostic-demo
  ports:
    - protocol: TCP
      port: 80
      targetPort: 3000
      name: http
