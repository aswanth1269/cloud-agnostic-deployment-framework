# Manual end-to-end smoke test: spins up Minikube inside the runner and
# exercises the full policy -> build -> load -> deploy flow.
# This is a TEST, not a production deployment - production CD is handled
# by Argo CD reconciling k8s/overlays/<cloud> (see argocd/README.md).

name: E2E Smoke Test (Minikube)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - uses: azure/setup-kubectl@v4
        with:
          version: v1.30.0

      - uses: medyagh/setup-minikube@latest
        with:
          kubernetes-version: v1.30.0
          driver: docker

      - name: Policy-driven deployment (local simulation)
        run: npm run deploy:k8s

      - name: Verify rollout
        run: |
          NS=$(node -e "console.log(require('./policy-engine/policyEngine').evaluatePolicy().selectedCloud)")
          kubectl rollout status deployment/cloud-agnostic-demo -n "$NS" --timeout=120s
          kubectl get pods -n "$NS"
